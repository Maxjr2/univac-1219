[package]
name = "univac1219"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
ux = "0.1.6"
console = "0.15.11"
clap = { version = "4.5.37", features = ["derive"] }
common = { path = "../common" }
compiler = { path = "../compiler" }
serialport = "4.8.1"
ansi_term = "0.12.1"
indicatif = "0.18.4"

[[bin]]
name = "assembler"
path = "src/assembler/bin/main.rs"

[[bin]]
name = "disassembler"
path = "src/disassembler/bin/main.rs"

[[bin]]
name = "emulator"
path = "src/emulator/bin/main.rs"

[[bin]]
name = "cc1219"
path = "src/compiler/bin/main.rs"
