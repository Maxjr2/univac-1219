name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # serialport (used by the cmd/emulator binary) requires libudev on Linux
      - name: Install system dependencies
        run: sudo apt-get update -y && sudo apt-get install -y libudev-dev

      - name: Build (excluding web)
        run: cargo build --workspace --exclude web

      - name: Test (excluding web)
        run: cargo test --workspace --exclude web

  wasm-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Check web crate (wasm32)
        run: cargo check --package univac-leptos --target wasm32-unknown-unknown
